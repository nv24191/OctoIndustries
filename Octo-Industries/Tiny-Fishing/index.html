<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071019">
  <title>Tiny Fishing | Octo Industries</title>
  <link rel="stylesheet" href="../branding/game-branding.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body,
    main,
    iframe {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background: #071019;
    }

    iframe {
      display: block;
      border: 0;
    }
  </style>
  <script defer src="../branding/game-branding.js"></script>

    <link rel="stylesheet" href="../branding/game-loader.css">
    <script defer src="../branding/game-loader.js" data-octo-auto-loader></script>
  </head>
<body>
  <main aria-label="Tiny Fishing">
    <iframe
      src="https://tiny-fishing.bitbucket.io/tiny-fishing/"
      title="Tiny Fishing"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </main>
</body>
</html>
