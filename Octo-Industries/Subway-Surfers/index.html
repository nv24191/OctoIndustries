<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Play the original Subway Surfers: New York browser game.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data: blob:; media-src 'self' data: blob:">
  <title>Subway Surfers: New York</title>
  <link rel="icon" href="../branding/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../branding/favicon.ico">
  <link rel="stylesheet" href="../branding/game-branding.css">
  <script>window.OCTO_GAME_BRANDING_CONFIG = { hubButtonPosition: 'bottom-left', watermarkPosition: 'bottom-right' };</script>
  <script defer src="../branding/game-branding.js"></script>
  <link rel="stylesheet" href="style.css">
  <script>
    const maxRenderScale = 1;
    window.GAME_CONFIG = { fps: 60, frameSkip: 0, maxViewportScale: maxRenderScale };
    const devicePixelRatio = window.devicePixelRatio || 1;
    if (devicePixelRatio > maxRenderScale) {
      Object.defineProperty(window, 'devicePixelRatio', {
        configurable: true,
        value: maxRenderScale,
      });
    }
  </script>

    <link rel="stylesheet" href="../branding/game-loader.css">
    <script defer src="../branding/game-loader.js" data-octo-auto-loader></script>
  </head>
<body>
  <main id="game-shell" aria-label="Subway Surfers game">
    <div id="og-game-holder"></div>
    <p id="game-error" role="alert" hidden>The original game could not start. Serve this project over HTTP or HTTPS and check that its local game files are present.</p>
  </main>
  <script src="js/games_lib/ludiAdapter.js"></script>
  <script src="js/boot.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((error) => {
          console.error('Subway Surfers offline caching could not be enabled.', error);
        });
      });
    }
  </script>
</body>
</html>
