<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#081c2b">
  <meta name="description" content="Play Turball, a browser-based 3D car-soccer game.">
  <title>Turball | Octo Industries</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #08111a; }
    body { display: grid; grid-template-rows: auto minmax(0, 1fr); color: #eaf5ff; font: 500 14px/1.5 system-ui, sans-serif; }
    .game-notice { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 16px; background: #0e1d2b; }
    .game-notice p { margin: 0; }
    .game-notice a { color: #8ee7e3; white-space: nowrap; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #081c2b; }
    @media (max-width: 540px) {
      .game-notice { align-items: flex-start; font-size: 12px; }
    }
  </style>

    <link rel="stylesheet" href="../branding/game-branding.css">
    <script defer src="../branding/game-branding.js"></script>
  </head>
<body>
  <aside class="game-notice">
    <p>Turball is played from its official online service and requires an internet connection.</p>
    <a href="https://turball.io/casual" target="_blank" rel="noopener noreferrer">Open Turball directly</a>
  </aside>
  <iframe
    src="https://turball.io/casual"
    title="Turball car-soccer game"
    allow="autoplay; fullscreen; gamepad; keyboard-map; pointer-lock"
    allowfullscreen
    referrerpolicy="strict-origin">
  </iframe>
</body>
</html>
