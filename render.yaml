services:
  - type: web
    name: octo-industries
    runtime: node
    buildCommand: echo "No build required"
    startCommand: node Octo-Industries/BehindTheScenes/admin/legacy-domain-redirect.mjs
    healthCheckPath: /healthz
  - type: web
    name: octo-industries-hub-web
    runtime: node
    buildCommand: npm --prefix Octo-Industries/BehindTheScenes run sync
    startCommand: npm --prefix Octo-Industries/BehindTheScenes start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: OCTO_ADMIN_PASSWORD_HASH
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        value: f302bb52008546bfbd9b3d66d6f9e444
      - key: CF_D1_DATABASE_ID
        value: 30379fff-1967-4f33-85d3-7df2627fe833
      - key: CF_D1_API_TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
